[package]
name = "mindnest"
version = "0.1.0"
description = "AI-native local-first knowledge base"
authors = ["MindNest Team"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "2.0.0", features = ["tray-icon", "devtools", "protocol-asset"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-http = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-process = "2.0.0"

# 异步运行时
tokio = { version = "1.35", features = ["full"] }

# 数据库
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 工具
uuid = { version = "1.7", features = ["v4", "serde"] }
nanoid = "0.4"
once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"

# 文件系统
walkdir = "2.4"
dirs = "5.0"

# 全文搜索 - 暂时禁用，等待依赖解决
# tantivy = "0.21"

# HTTP 客户端
reqwest = { version = "0.11", features = ["json"] }

# 加密
ring = "0.17"
sha2 = "0.10"

# 类型安全
specta = { version = "1.0.5", features = ["functions"] }
tauri-specta = { version = "2.0.0-rc.21", features = ["javascript", "typescript"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
